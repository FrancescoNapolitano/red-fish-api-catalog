<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: page(#{ui.change.password}, ~{::section})}">
<body>
<section>
    <div class="rf-page-header">
        <div>
            <h1 class="rf-page-title"><th:block th:text="#{ui.change.password}">Change password</th:block></h1>
            <p class="rf-page-subtitle" th:text="${currentUser != null ? currentUser.username : ''}"></p>
        </div>
    </div>

    <div class="alert alert-warning py-2 rf-small" th:if="${param.required != null}">
        <i class="bi bi-exclamation-triangle"></i>
        <th:block th:text="#{ui.you.must.set.a.new.password.before.continuing}">You must set a new password before continuing.</th:block>
    </div>

    <div class="rf-panel" style="max-width: 30rem">
        <div class="rf-panel-body">
            <form th:action="@{/account/password}" method="post">
                <div class="mb-3">
                    <label class="form-label rf-required" for="currentPassword"><th:block th:text="#{ui.current.password}">Current password</th:block></label>
                    <input class="form-control" id="currentPassword" name="currentPassword" type="password"
                           autocomplete="current-password" required>
                </div>
                <div class="mb-3">
                    <label class="form-label rf-required" for="newPassword"><th:block th:text="#{ui.new.password}">New password</th:block></label>
                    <input class="form-control" id="newPassword" name="newPassword" type="password" minlength="8"
                           autocomplete="new-password" required>
                    <div class="form-text"><th:block th:text="#{ui.at.least.8.characters}">At least 8 characters.</th:block></div>
                </div>
                <div class="mb-3">
                    <label class="form-label rf-required" for="confirmPassword"><th:block th:text="#{ui.confirm.new.password}">Confirm new password</th:block></label>
                    <input class="form-control" id="confirmPassword" name="confirmPassword" type="password"
                           minlength="8" autocomplete="new-password" required>
                </div>
                <button class="btn btn-primary" type="submit"><i class="bi bi-key"></i> <th:block th:text="#{ui.update}">Update</th:block></button>
            </form>
        </div>
    </div>
</section>
</body>
</html>
