<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: page(#{ui.roles.and.permissions}, ~{::section})}">
<body>
<section>
    <div class="rf-page-header">
        <div>
            <h1 class="rf-page-title"><th:block th:text="#{ui.roles.and.permissions}">Roles and permissions</th:block></h1>
            <p class="rf-page-subtitle">
                <th:block th:text="#{ui.permissions.assigned.here.apply.across.the.catalog.to.restrict.them.to}">Permissions assigned here apply across the catalog. To restrict them to a branch, use group permissions on the user page.</th:block>
            </p>
        </div>
        <div class="rf-page-actions">
            <button class="btn btn-sm btn-primary" type="button" data-bs-toggle="modal"
                    data-bs-target="#newRoleModal">
                <i class="bi bi-plus-lg"></i> <th:block th:text="#{ui.new.role}">New role</th:block>
            </button>
        </div>
    </div>

    <div class="rf-panel mb-3">
        <div class="rf-panel-header"><i class="bi bi-grid-3x3"></i> <th:block th:text="#{ui.permission.matrix}">Permission matrix</th:block></div>
        <div class="table-responsive">
            <table class="table rf-table table-hover mb-0">
                <thead>
                <tr>
                    <th style="min-width: 18rem"><th:block th:text="#{ui.permission}">Permission</th:block></th>
                    <th class="text-center" th:each="r : ${roles}" th:text="${r.name}"></th>
                </tr>
                </thead>
                <tbody>
                <th:block th:each="entry : ${permissionsByCategory}">
                    <tr>
                        <td class="rf-muted rf-small fw-semibold" th:attr="colspan=${roles.size() + 1}"
                            th:text="${entry.key}"></td>
                    </tr>
                    <tr th:each="p : ${entry.value}">
                        <td>
                            <span th:text="${p.label}"></span>
                            <code class="rf-small rf-muted d-block" th:text="${p.code}"></code>
                        </td>
                        <td class="text-center" th:each="r : ${roles}">
                            <i class="bi" th:classappend="${r.permissions.contains(p.code)}
                                          ? 'bi-check-circle-fill text-success' : 'bi-dash text-secondary'"></i>
                        </td>
                    </tr>
                </th:block>
                </tbody>
            </table>
        </div>
    </div>

    <div class="rf-panel mb-3" th:each="r : ${roles}">
        <div class="rf-panel-header">
            <i class="bi bi-shield-lock"></i>
            <span th:text="${r.name}"></span>
            <span class="badge text-bg-secondary" th:if="${r.systemRole}"><th:block th:text="#{ui.system}">system</th:block></span>
            <div class="ms-auto d-flex gap-2">
                <form th:action="@{/admin/roles/{id}/delete(id=${r.id})}" method="post" th:if="${!r.systemRole}">
                    <button class="btn btn-sm btn-outline-danger" type="submit"
                            th:attr="data-confirm=#{ui.delete.role.2} + ${r.name} + '?'">
                        <i class="bi bi-trash"></i>
                    </button>
                </form>
            </div>
        </div>
        <div class="rf-panel-body">
            <form th:action="@{/admin/roles/{id}(id=${r.id})}" method="post">
                <div class="mb-3">
                    <label class="form-label" th:for="'desc-' + ${r.id}"><th:block th:text="#{ui.description}">Description</th:block></label>
                    <input class="form-control form-control-sm" th:id="'desc-' + ${r.id}" name="description"
                           type="text" th:value="${r.description}">
                </div>
                <div class="row g-2">
                    <div class="col-md-4 col-lg-3" th:each="p : ${allPermissions}">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="permissions" th:value="${p.code}"
                                   th:id="${r.id} + '-' + ${p.code}" th:checked="${r.permissions.contains(p.code)}">
                            <label class="form-check-label rf-small" th:for="${r.id} + '-' + ${p.code}"
                                   th:text="${p.label}"></label>
                        </div>
                    </div>
                </div>
                <button class="btn btn-sm btn-primary mt-3" type="submit">
                    <i class="bi bi-check2"></i> <th:block th:text="#{ui.save.permissions}">Save permissions</th:block>
                </button>
            </form>
        </div>
    </div>

    <div class="modal fade" id="newRoleModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <form class="modal-content" th:action="@{/admin/roles}" method="post">
                <div class="modal-header">
                    <h5 class="modal-title"><th:block th:text="#{ui.new.role}">New role</th:block></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" th:aria-label="#{ui.close}"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="form-label rf-required" for="newRoleName"><th:block th:text="#{ui.name}">Name</th:block></label>
                            <input class="form-control" id="newRoleName" name="name" type="text" required
                                   th:placeholder="#{ui.e.g.architect}">
                            <div class="form-text"><th:block th:text="#{ui.converted.to.uppercase}">Converted to uppercase.</th:block></div>
                        </div>
                        <div class="col-md-8">
                            <label class="form-label" for="newRoleDescription"><th:block th:text="#{ui.description}">Description</th:block></label>
                            <input class="form-control" id="newRoleDescription" name="description" type="text">
                        </div>
                    </div>
                    <div class="row g-2">
                        <div class="col-md-4" th:each="p : ${allPermissions}">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="permissions" th:value="${p.code}"
                                       th:id="'new-' + ${p.code}">
                                <label class="form-check-label rf-small" th:for="'new-' + ${p.code}"
                                       th:text="${p.label}"></label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal"><th:block th:text="#{ui.cancel}">Cancel</th:block></button>
                    <button class="btn btn-primary" type="submit"><th:block th:text="#{ui.create.role}">Create role</th:block></button>
                </div>
            </form>
        </div>
    </div>
</section>
</body>
</html>
