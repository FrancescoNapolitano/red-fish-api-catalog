<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" th:fragment="page(pageTitle, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null} ? ${_csrf.token} : ''">
    <meta name="_csrf_header" th:content="${_csrf != null} ? ${_csrf.headerName} : 'X-CSRF-TOKEN'">
    <title th:text="|${pageTitle} · ${appName != null ? appName : 'API Catalog'}|">API Catalog</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" th:href="@{/img/favicon.svg}" type="image/svg+xml">
    <script th:src="@{/js/app.js}"></script>
</head>
<body>
<div class="rf-centered-page">
    <div>
        <div class="d-flex align-items-center justify-content-center gap-2 mb-3">
            <span class="rf-brand-mark"><i class="bi bi-diagram-3-fill"></i></span>
            <span class="fw-semibold fs-5" th:text="${appName != null ? appName : 'API Catalog'}">API Catalog</span>
        </div>
<div class="text-center mb-3"><th:block th:replace="~{fragments/language :: selector}"></th:block></div>
        <th:block th:replace="${content}"></th:block>
        <p class="text-center rf-muted rf-small mt-3 mb-0">
            <button class="btn btn-sm btn-link rf-muted" type="button" data-action="toggle-theme">
                <i class="bi bi-moon-stars" data-theme-icon></i> <th:block th:text="#{ui.switch.theme}">Switch theme</th:block>
            </button>
        </p>
    </div>
</div>
<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
